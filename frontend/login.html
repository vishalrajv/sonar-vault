<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonar Vault - Login</title>
    <!-- Bootstrap 5.3.3 Local -->
    <link href="static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <script src="static/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm" style="width: 24rem;">
        <div class="card-body p-4">
            <h1 class="card-title text-center text-primary fw-bold mb-4">Sonar Vault</h1>
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-medium text-secondary">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small fw-medium text-secondary">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                    <label class="form-check-label small text-dark" for="remember_me">
                        Remember me
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
            </form>
            <div id="error-message" class="alert alert-danger mt-3 py-2 text-center d-none" role="alert"></div>
        </div>
    </div>
    <script src="static/js/login.js"></script>
</body>
</html>
