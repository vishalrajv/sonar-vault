<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonar Vault - Register</title>
    <!-- Bootstrap 5.3.3 Local -->
    <link href="static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <script src="static/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="card shadow-sm" style="width: 30rem;">
        <div class="card-body p-4">
            <h1 class="card-title text-center text-primary fw-bold mb-4">Sonar Vault</h1>
            <h5 class="text-center text-secondary mb-4">Create New Account</h5>
            <form id="register-form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="staff_number" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Staff Number</label>
                        <input type="text" id="staff_number" name="staff_number" class="form-control" required placeholder="e.g. BEL12345">
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required placeholder="********">
                    </div>
                    <div class="col-12">
                        <label for="full_name" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Full Name</label>
                        <input type="text" id="full_name" name="full_name" class="form-control" required placeholder="Enter your full name">
                    </div>
                    <div class="col-md-6">
                        <label for="department" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Department</label>
                        <select id="department" name="department" class="form-select" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="D&E">Design & Engineering (D&E)</option>
                            <option value="BSTC">BSTC</option>
                            <option value="Testing">Testing</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="role_designation" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Designation</label>
                        <input type="text" id="role_designation" name="role_designation" class="form-control" required placeholder="e.g. Engineer">
                    </div>
                    <div class="col-md-6">
                        <label for="dob" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Date of Birth</label>
                        <input type="date" id="dob" name="dob" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="phone_number" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Phone Number</label>
                        <input type="tel" id="phone_number" name="phone_number" class="form-control" required placeholder="Mobile Number">
                    </div>
                    <div class="col-12">
                        <label for="personal_email" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Personal Email</label>
                        <input type="email" id="personal_email" name="personal_email" class="form-control" required placeholder="personal@email.com">
                    </div>
                    <div class="col-12">
                        <label for="official_email" class="form-label small fw-medium text-secondary text-uppercase tracking-wider" style="font-size: 11px;">Official Email</label>
                        <input type="email" id="official_email" name="official_email" class="form-control" required placeholder="username@bel.co.in">
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-semibold mt-4">Register Account</button>
            </form>
            <div id="status-message" class="alert mt-3 py-2 text-center d-none" role="alert"></div>
            <div class="text-center mt-3">
                <span class="small text-secondary">Already have an account?</span>
                <a href="login.html" class="small fw-bold text-decoration-none">Login Here</a>
            </div>
        </div>
    </div>
    <script src="static/js/register.js"></script>
</body>
</html>
