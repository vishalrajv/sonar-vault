<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonar Vault - Dashboard</title>
    <link rel="stylesheet" href="static/css/tailwind.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-blue-900 text-white flex-shrink-0 transition-transform duration-300 transform md:translate-x-0 -translate-x-full fixed md:relative h-full z-20">
            <div class="p-6">
                <h1 class="text-2xl font-bold tracking-wider">SONAR VAULT</h1>
                <p class="text-xs text-blue-300 mt-1">Version 1.0.0</p>
            </div>
            <nav class="mt-6 px-4">
                <a href="dashboard.html" class="flex items-center p-3 text-blue-100 hover:bg-blue-800 rounded transition-colors bg-blue-800">
                    <span class="ml-3">Dashboard</span>
                </a>
                <a href="#" class="flex items-center mt-2 p-3 text-blue-300 hover:bg-blue-800 hover:text-white rounded transition-colors">
                    <span class="ml-3">Upload Binary</span>
                </a>
                <a href="#" class="flex items-center mt-2 p-3 text-blue-300 hover:bg-blue-800 hover:text-white rounded transition-colors">
                    <span class="ml-3">View Fleet</span>
                </a>
            </nav>
        </aside>

        <!-- Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto overflow-x-hidden">
            <!-- Header -->
            <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
                <button id="sidebar-toggle" class="md:hidden p-2 hover:bg-gray-100 rounded">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div class="flex items-center ml-auto">
                    <span class="mr-4 text-sm font-medium">Welcome, Admin</span>
                    <button class="bg-red-600 text-white px-4 py-1.5 rounded text-sm hover:bg-red-700 transition">Logout</button>
                </div>
            </header>

            <!-- Main Content -->
            <main class="p-6">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Dashboard Overview</h2>
                    <p class="text-gray-500">Fleet-wide software state at a glance.</p>
                </div>

                <!-- Dashboard Content (Placeholder for next tasks) -->
                <div id="dashboard-content">
                    <!-- Stat Cards will go here -->
                </div>
            </main>
        </div>
    </div>
</body>
</html>
